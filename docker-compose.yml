services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: drag
      POSTGRES_PASSWORD: drag
      POSTGRES_DB: dragdb
    ports:
      - "${DB_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 仅首次初始化（数据卷为空时）执行：样例业务库
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drag -d dragdb"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://drag:drag@db:5432/dragdb
      QUERY_STATEMENT_TIMEOUT_MS: "5000"
      QUERY_MAX_ROWS: "10000"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata:
